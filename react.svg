* {
  box-sizing: border-box;
}

:root {
  font-family: Inter, Arial, Helvetica, sans-serif;
  color: #202124;
  background: #eef1f5;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

html,
body,
#root {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background:
    radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.95), transparent 35%),
    radial-gradient(circle at 90% 90%, rgba(210, 220, 235, 0.7), transparent 40%),
    #eef1f5;
}

/* =========================
   GŁÓWNA APLIKACJA
   ========================= */

.app {
  width: 100%;
  height: 100vh;
  display: flex;
  padding: 14px;
  gap: 14px;
}

/* =========================
   SIDEBAR
   ========================= */

.sidebar {
  width: 245px;
  height: 100%;
  flex-shrink: 0;

  display: flex;
  flex-direction: column;

  background: rgba(255, 255, 255, 0.58);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 22px;

  box-shadow:
    0 10px 40px rgba(31, 38, 52, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);

  overflow: hidden;
}

.sidebar-top {
  padding: 22px 16px 15px;
}

.sidebar-top h2 {
  margin: 0 0 18px 4px;

  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.4px;
}

.new-chat {
  width: 100%;
  height: 42px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 13px;

  background: rgba(255, 255, 255, 0.72);
  color: #202124;

  box-shadow:
    0 5px 18px rgba(31, 38, 52, 0.06),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);

  cursor: pointer;
  font-size: 14px;
  font-weight: 500;

  transition:
    transform 0.18s ease,
    background 0.18s ease,
    box-shadow 0.18s ease;
}

.new-chat:hover {
  background: rgba(255, 255, 255, 0.95);
  transform: translateY(-1px);

  box-shadow:
    0 8px 22px rgba(31, 38, 52, 0.09),
    inset 0 1px 0 rgba(255, 255, 255, 1);
}

.new-chat:active {
  transform: translateY(0);
}

/* =========================
   HISTORIA
   ========================= */

.chat-history {
  flex: 1;
  overflow-y: auto;
  padding: 4px 9px 14px;
}

.chat-history::-webkit-scrollbar,
.chat::-webkit-scrollbar {
  width: 6px;
}

.chat-history::-webkit-scrollbar-thumb,
.chat::-webkit-scrollbar-thumb {
  background: rgba(80, 88, 105, 0.2);
  border-radius: 10px;
}

.history-item {
  min-height: 42px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;

  margin-bottom: 4px;
  padding: 9px 9px 9px 12px;

  border: 1px solid transparent;
  border-radius: 12px;

  color: #454a54;

  cursor: pointer;

  transition:
    background 0.18s ease,
    border 0.18s ease,
    transform 0.18s ease;
}

.history-item:hover {
  background: rgba(255, 255, 255, 0.55);
  border-color: rgba(255, 255, 255, 0.65);
}

.history-item.active {
  background: rgba(255, 255, 255, 0.8);
  border-color: rgba(255, 255, 255, 0.9);

  box-shadow:
    0 4px 15px rgba(31, 38, 52, 0.05);
}

.history-item span {
  min-width: 0;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;

  font-size: 13px;
}

.delete-chat {
  width: 25px;
  height: 25px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: none;
  border-radius: 8px;

  background: transparent;
  color: #8b9099;

  cursor: pointer;
  font-size: 17px;

  transition:
    background 0.18s ease,
    color 0.18s ease;
}

.delete-chat:hover {
  background: rgba(220, 70, 70, 0.1);
  color: #d44d4d;
}

/* =========================
   GŁÓWNY PANEL
   ========================= */

.main {
  position: relative;

  flex: 1;
  min-width: 0;
  height: 100%;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: rgba(255, 255, 255, 0.48);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 22px;

  box-shadow:
    0 10px 40px rgba(31, 38, 52, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

/* =========================
   HEADER
   ========================= */

.header {
  height: 60px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 24px;

  background: rgba(255, 255, 255, 0.28);
  border-bottom: 1px solid rgba(255, 255, 255, 0.65);
}

.header h1 {
  margin: 0;

  font-size: 18px;
  font-weight: 650;
  letter-spacing: -0.3px;
}

.header span {
  padding: 6px 10px;

  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 999px;

  background: rgba(255, 255, 255, 0.48);

  color: #727782;
  font-size: 12px;
}

/* =========================
   OBSZAR CZATU
   ========================= */

.chat {
  flex: 1;

  width: 100%;
  max-width: 900px;

  margin: 0 auto;

  overflow-y: auto;

  padding: 30px 30px 135px;
}

.chat::-webkit-scrollbar {
  width: 7px;
}

.chat::-webkit-scrollbar-thumb {
  background: rgba(80, 88, 105, 0.18);
  border-radius: 10px;
}

/* =========================
   POWITANIE
   ========================= */

.welcome {
  text-align: center;
  margin-top: 18vh;
}

.welcome h2 {
  margin: 0 0 9px;

  font-size: 30px;
  font-weight: 650;
  letter-spacing: -1px;

  color: #252832;
}

.welcome p {
  margin: 0;

  color: #777d88;
  font-size: 14px;
}

/* =========================
   WIADOMOŚCI
   ========================= */

.message {
  width: fit-content;
  max-width: 75%;

  margin-bottom: 15px;
  padding: 11px 15px;

  border-radius: 17px;

  white-space: pre-wrap;
  overflow-wrap: anywhere;

  line-height: 1.55;
  font-size: 14px;

  animation: messageAppear 0.18s ease-out;
}

@keyframes messageAppear {
  from {
    opacity: 0;
    transform: translateY(4px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Wiadomość użytkownika */

.message.user {
  margin-left: auto;

  background: rgba(35, 38, 45, 0.94);
  color: white;

  border: 1px solid rgba(255, 255, 255, 0.08);

  box-shadow:
    0 5px 18px rgba(30, 34, 42, 0.12);
}

/* Odpowiedź AI */

.message.assistant {
  background: rgba(255, 255, 255, 0.68);
  color: #292d35;

  border: 1px solid rgba(255, 255, 255, 0.85);

  box-shadow:
    0 5px 20px rgba(31, 38, 52, 0.045);
}

/* =========================
   POLE WPISYWANIA
   ========================= */

.input-area {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

  z-index: 5;

  display: flex;
  justify-content: center;

  padding: 16px 24px 20px;

  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0),
    rgba(255, 255, 255, 0.65) 25%,
    rgba(255, 255, 255, 0.82)
  );

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* =========================
   FORMULARZ / TEXTAREA
   ========================= */

textarea {
  flex: 1;

  min-height: 48px;
  max-height: 150px;

  resize: none;

  padding: 13px 15px;

  border: 1px solid rgba(190, 195, 204, 0.65);
  border-radius: 16px;

  outline: none;

  background: rgba(255, 255, 255, 0.78);

  color: #252830;

  font-family: inherit;
  font-size: 14px;
  line-height: 1.45;

  box-shadow:
    0 8px 25px rgba(31, 38, 52, 0.07),
    inset 0 1px 0 rgba(255, 255, 255, 0.95);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  transition:
    border 0.18s ease,
    box-shadow 0.18s ease,
    background 0.18s ease;
}

textarea::placeholder {
  color: #9297a0;
}

textarea:focus {
  border-color: rgba(100, 110, 130, 0.55);

  background: rgba(255, 255, 255, 0.92);

  box-shadow:
    0 9px 28px rgba(31, 38, 52, 0.1),
    0 0 0 3px rgba(120, 130, 150, 0.08);
}

/* =========================
   PRZYCISK WYŚLIJ
   ========================= */

.input-area button {
  min-width: 82px;
  height: 48px;

  padding: 0 18px;

  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 15px;

  background: rgba(35, 38, 45, 0.96);
  color: white;

  cursor: pointer;

  font-family: inherit;
  font-size: 13px;
  font-weight: 550;

  box-shadow:
    0 7px 20px rgba(30, 34, 42, 0.14);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    opacity 0.18s ease;
}

.input-area button:hover:not(:disabled) {
  transform: translateY(-1px);

  box-shadow:
    0 10px 24px rgba(30, 34, 42, 0.18);
}

.input-area button:active:not(:disabled) {
  transform: translateY(0);
}

.input-area button:disabled {
  opacity: 0.45;
  cursor: default;
}

/* =========================
   PRZYCISK MENU
   ========================= */

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-button {
  display: none;

  width: 36px;
  height: 36px;

  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 11px;

  background: rgba(255, 255, 255, 0.55);
  color: #343840;

  cursor: pointer;

  font-size: 18px;
  line-height: 1;

  box-shadow:
    0 4px 12px rgba(31, 38, 52, 0.06);

  transition:
    background 0.18s ease,
    transform 0.18s ease;
}

.menu-button:hover {
  background: rgba(255, 255, 255, 0.9);
  transform: translateY(-1px);
}

/* =========================
   TELEFON
   ========================= */

@media (max-width: 750px) {
  .app {
    position: relative;

    padding: 0;
    gap: 0;
  }

  /* Sidebar wysuwa się z lewej strony */

  .sidebar {
    position: fixed;

    top: 0;
    left: 0;
    bottom: 0;

    z-index: 100;

    width: 275px;
    height: 100vh;

    border-radius: 0 22px 22px 0;

    transform: translateX(-105%);

    transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);

    box-shadow:
      10px 0 40px rgba(31, 38, 52, 0.16);
  }

  .sidebar.sidebar-open {
    transform: translateX(0);
  }

  /* Główny panel zajmuje cały telefon */

  .main {
    width: 100%;
    height: 100vh;

    border-radius: 0;
    border: none;
  }

  /* Pokazujemy hamburger */

  .menu-button {
    display: flex;
  }

  .header {
    height: 58px;

    padding: 0 15px;
  }

  .header h1 {
    font-size: 17px;
  }

  /* Chat */

  .chat {
    width: 100%;

    padding: 24px 14px 125px;
  }

  .message {
    max-width: 88%;
    font-size: 14px;
  }

  /* Pole wpisywania */

  .input-area {
    padding: 10px 10px 14px;
  }

  textarea {
    min-height: 46px;

    font-size: 14px;
  }

  .input-area button {
    min-width: 65px;
    height: 46px;

    padding: 0 12px;
  }
}

@media (max-width: 520px) {
  .sidebar {
    width: 285px;
  }

  .chat {
    padding-left: 11px;
    padding-right: 11px;
  }

  .message {
    max-width: 92%;
    font-size: 13px;
  }

  textarea {
    font-size: 13px;
  }
}
/* =========================
   TŁO ZA WYSUNIĘTYM MENU
   ========================= */

.sidebar-overlay {
  display: none;
}

@media (max-width: 750px) {
  .sidebar-overlay {
    display: block;

    position: fixed;
    inset: 0;

    z-index: 90;

    background: rgba(20, 24, 32, 0.25);

    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);

    animation: overlayAppear 0.2s ease;
  }

  @keyframes overlayAppear {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }

  .sidebar {
    z-index: 100;
  }
}